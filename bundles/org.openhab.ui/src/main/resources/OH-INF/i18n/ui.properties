# configuration

ui.config.main.ruleTypesAsScript.label = View Rule Types as Script
ui.config.main.ruleTypesAsScript.description = Configure what types of read-only rules should be opened directly in the script editor, based on the media/MIME type of the script action. If you for example want all JavaScript rules to open directly in the script editor, specify 'application/javascript'.
ui.config.main.ruleTypesAsScript.option.application/vnd.openhab.dsl.rule = DSL Rule
ui.config.main.ruleTypesAsScript.option.application/x-groovy = Groovy Rule
ui.config.main.ruleTypesAsScript.option.application/javascript = JavaScript Rule
ui.config.main.ruleTypesAsScript.option.application/python = Python Rule
ui.config.main.ruleTypesAsScript.option.application/x-ruby = Ruby Rule
